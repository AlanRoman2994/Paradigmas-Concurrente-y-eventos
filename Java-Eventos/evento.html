<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Eventos</title>
</head>
<body>
    <button id="boton">haz click aqui</button>
    <script>
        document.getElementById("boton").addEventListener("click", function() {
            alert("¡Evento capturado: boton presionado!");
        });
</script>
</body>
</html>
